<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Eletrônico - Controle Firebase</title>
    <!-- Link para o arquivo de estilo -->
    <link rel="stylesheet" href="style.css">
    <!-- Fonte digital estilo letreiro de LED/Estacionamento -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="display-container">
        <!-- Título do Letreiro -->
        <div class="display-header">SISTEMA DE VAGAS</div>

        <!-- Tela Principal do Display Digital -->
        <div id="status-panel" class="display-screen status-off">
            CARREGANDO...
        </div>

        <!-- Botões de Controle -->
        <div class="control-box">
            <button id="btn-on" class="btn btn-on">LIGAR</button>
            <button id="btn-off" class="btn btn-off">DESLIGAR</button>
        </div>
    </div>

    <!-- Importação do arquivo lógico em JavaScript -->
    <script type="module" src="app.js"></script>
</body>
</html>
